<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe Hands Safe Children – Level 1 · Inspired</title>
<meta name="description" content="Level 1: a one-hour Early Years course on respectful physical interaction, safeguarding and speaking up. Pilot course with automatic completion certificates.">
<link rel="icon" type="image/png" href="assets/brand/inspired-logo-colour.png">
<link rel="stylesheet" href="style.css">
<script src="course-data.js" defer></script>
<script src="course-data-fr.js" defer></script>
<script src="course-data-mfe.js" defer></script>
<script src="i18n.js" defer></script>
<script src="vendor/pdf-lib.min.js" defer></script>
<script src="certificate.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to course</a>
<header>
<a class="brand" href="#home" aria-label="Inspired Education"><img src="assets/brand/inspired-logo-colour.png" alt="Inspired Education" width="193" height="71"></a>
<div class="header-title" data-i18n="headerTitle">EARLY YEARS · STAFF DEVELOPMENT</div>
<div class="language-control"><label for="language" data-i18n="language">Course language</label><select id="language"><option value="en" lang="en">English</option><option value="fr" lang="fr">Français</option><option value="mfe" lang="mfe">Kreol Morisien</option></select></div>

<div class="layout">

<div class="progress-label"><span data-i18n="progress">Your progress</span><strong id="percent">0%</strong></div>
<progress id="progress" max="5" value="0"></progress>
<nav id="nav" aria-label="Course navigation"></nav>
<div class="side-bottom"><a href="#contacts" data-i18n="contactsNav">Safeguarding contacts</a></div>
</aside>
<main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
